name: Verify Unreal Engine access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-epic-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check access to EpicGames/UnrealEngine
        env:
          EPIC_GITHUB_TOKEN: ${{ secrets.EPIC_GITHUB_TOKEN }}
        run: |
          if [ -z "$EPIC_GITHUB_TOKEN" ]; then
            echo "::error::Missing EPIC_GITHUB_TOKEN repository secret."
            exit 1
          fi

          response="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $EPIC_GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/EpicGames/UnrealEngine/contents/README.md)"

          file_name="$(printf '%s' "$response" | jq -r '.name')"
          if [ "$file_name" != "README.md" ]; then
            echo "::error::Epic repository access could not be verified."
            exit 1
          fi

          echo "SUCCESS: GitHub Actions can read EpicGames/UnrealEngine."
          echo "Verified file: $file_name"
